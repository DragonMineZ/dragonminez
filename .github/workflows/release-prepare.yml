name: DragonMineZ Release Prepare

on:
  push:
    branches:
      - main
    paths:
      - gradle.properties
      - CHANGELOG.md
      - release-notes/**
      - scripts/release/**
      - .github/workflows/release-prepare.yml
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    name: Prepare release candidate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep '^mod_version=' gradle.properties | cut -d= -f2-)"
          lower_version="$(printf '%s' "$version" | tr '[:upper:]' '[:lower:]')"
          stable="true"
          if [[ "$lower_version" == *alpha* || "$lower_version" == *beta* ]]; then
            stable="false"
            echo "::notice::Skipping release preparation for non-stable version '${version}'."
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "stable=${stable}" >> "$GITHUB_OUTPUT"
          echo "artifact=build/libs/dragonminez-${version}.jar" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17 Temurin
        if: steps.metadata.outputs.stable == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        if: steps.metadata.outputs.stable == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          dependency-graph: generate-and-submit
          artifact-retention-days: 2

      - name: Make gradlew executable
        if: steps.metadata.outputs.stable == 'true'
        run: chmod +x ./gradlew

      - name: Build release jar
        if: steps.metadata.outputs.stable == 'true'
        run: ./gradlew build

      - name: Build release manifest
        if: steps.metadata.outputs.stable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          changelog_args=()
          if [[ -f "release-notes/${{ steps.metadata.outputs.version }}.md" ]]; then
            changelog_args+=(--changelog-file "release-notes/${{ steps.metadata.outputs.version }}.md")
          elif [[ -f CHANGELOG.md ]]; then
            changelog_args+=(--changelog-file CHANGELOG.md)
          fi

          python3 -m scripts.release.prepare_release \
            --artifact "${{ steps.metadata.outputs.artifact }}" \
            --manifest release-manifest.json \
            --bot-payload release-bot-payload.json \
            --require-stable \
            "${changelog_args[@]}"

      - name: Upload release manifest
        if: steps.metadata.outputs.stable == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dragonminez-release-manifest-${{ steps.metadata.outputs.version }}
          path: |
            release-manifest.json
            release-bot-payload.json
          if-no-files-found: error
          retention-days: 14

      - name: Notify Discord bot
        if: steps.metadata.outputs.stable == 'true'
        env:
          DMZ_VPS_HOST: ${{ vars.DMZ_VPS_HOST }}
          DMZ_VPS_PORT: ${{ vars.DMZ_VPS_PORT }}
          DMZ_VPS_USER: ${{ secrets.DMZ_VPS_USER }}
          DMZ_VPS_SSH_KEY: ${{ secrets.DMZ_VPS_SSH_KEY }}
          DMZ_VPS_KNOWN_HOSTS: ${{ secrets.DMZ_VPS_KNOWN_HOSTS }}
          RELEASE_WEBHOOK_SECRET: ${{ secrets.DMZ_RELEASE_BOT_WEBHOOK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          : "${DMZ_VPS_HOST:?DMZ_VPS_HOST repository variable is required}"
          : "${DMZ_VPS_USER:?DMZ_VPS_USER secret is required}"
          : "${DMZ_VPS_SSH_KEY:?DMZ_VPS_SSH_KEY secret is required}"
          : "${DMZ_VPS_KNOWN_HOSTS:?DMZ_VPS_KNOWN_HOSTS secret is required}"
          : "${RELEASE_WEBHOOK_SECRET:?DMZ_RELEASE_BOT_WEBHOOK_SECRET secret is required}"

          port="${DMZ_VPS_PORT:-22}"
          if [[ ! "$port" =~ ^[0-9]+$ ]]; then
            echo "::error::DMZ_VPS_PORT must be numeric."
            exit 1
          fi
          if [[ ! "$DMZ_VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::DMZ_VPS_HOST must be a DNS name or IPv4 address without a protocol."
            exit 1
          fi
          if [[ ! "$DMZ_VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]*[$]?$ ]]; then
            echo "::error::DMZ_VPS_USER contains unsupported characters."
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DMZ_VPS_SSH_KEY" > ~/.ssh/dmz_deploy_key
          chmod 600 ~/.ssh/dmz_deploy_key
          printf '%s\n' "$DMZ_VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -l -f ~/.ssh/known_hosts >/dev/null

          lookup_host="$DMZ_VPS_HOST"
          if [[ "$port" != "22" ]]; then
            lookup_host="[$DMZ_VPS_HOST]:$port"
          fi
          if ! ssh-keygen -F "$lookup_host" -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::DMZ_VPS_KNOWN_HOSTS does not contain an entry for ${lookup_host}."
            exit 1
          fi

          ssh_opts=(
            -4
            -i "$HOME/.ssh/dmz_deploy_key"
            -p "$port"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          remote="${DMZ_VPS_USER}@${DMZ_VPS_HOST}"
          secret_b64="$(printf '%s' "$RELEASE_WEBHOOK_SECRET" | base64 -w0)"

          # Delivered over SSH to the bot's local port: the public hostname sits behind
          # a Cloudflare managed challenge that answers curl with a 403 interstitial.
          cat release-bot-payload.json | ssh "${ssh_opts[@]}" "$remote" \
            "secret=\$(printf '%s' '$secret_b64' | base64 -d); \
             curl --fail-with-body --show-error --silent \
               -X POST \
               -H 'Content-Type: application/json' \
               -H \"X-DMZ-Release-Bot-Secret: \${secret}\" \
               --data-binary @- \
               http://127.0.0.1:8088/dmz-release"
