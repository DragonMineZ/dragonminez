###############################
###### GRADLE PROPERTIES ######
###############################
org.gradle.jvmargs=-Xmx4G
org.gradle.workers.max=2
# Offline must be false for NeoForge dependency resolution on a fresh port.
org.gradle.offline=false
org.gradle.parallel=true
org.gradle.caching=true
##########################
###### ENVIRONMENT #######
##########################
# Verified against NeoForged MDK archive/1.21-mdg + Maven metadata
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.238
neo_version_range=[21.1.238,)
loader_version_range=[4,)
# Parchment: official MDK 1.21.1 values, zip verified on parchmentmc.org
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
# Mandatory deps — versions verified on their official Maven repos
geckolib_version=4.9.2
geckolib_version_range=[4.9.2,)
terrablender_version=1.21.1-4.1.0.8
terrablender_version_range=[1.21.1-4.1.0.8,)
curios_version=9.5.1+1.21.1
curios_version_range=[9.5.1+1.21.1,)
# Optional compile-time only (JEI API verified on maven.blamejared.com)
jei_version=19.43.0.393
#############################
###### MOD INFORMATION ######
#############################
mod_id=dragonminez
mod_name=DragonMineZ
mod_license=GNU General Public License v3.0
#########################
### mod_version follows the format: version.major.minor[.patch]-[tags]
### - Normally the version prefix '-beta' or '-alpha' is used for pre-release versions.
mod_version=2.1.3
#########################
mod_group_id=com.dragonminez.mod
mod_authors=Yuseix300 & ezShokkoh
mod_credits=A special thanks to Bruno, Kyo, UB, YaibaToKen, Ben, Antro, and everyone else who supported the mod in some way.
mod_description=The DragonMine Z Mod is a Minecraft NeoForge Mod based on the Dragon Ball Series made by Akira Toriyama.\n\
  \ This mod adds NPCs, Transformations, Stats System, Dimensions and more!
